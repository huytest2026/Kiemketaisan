
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HỆ THỐNG KIỂM KÊ TÀI SẢN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      width: 100%;
      height: 100vh;
    }

    .app-header {
      flex: 0 0 auto;
      height: 42px;
      display: flex;
      align-items: center;
      padding: 0 14px;
      color: white;
      background: #174a7e;
      font-size: 15px;
      font-weight: bold;
    }

    .app-frame {
      flex: 1 1 auto;
      width: 100%;
      min-height: 0;
      border: none;
      display: block;
      background: white;
    }
  </style>
</head>

<body>
  <div class="app-container">

    <div class="app-header">
      HỆ THỐNG QUẢN LÝ KIỂM KÊ TÀI SẢN
    </div>

    <iframe
      class="app-frame"
      id="assetApp"
      src="https://script.google.com/macros/s/AKfycbxCMKhXleevsS-nGpDTVLXidklfRGUrny6PG7EfrnZ4aTYsB1EsiqQmBBT6UROhXRcE6w/exec"
      title="Ứng dụng kiểm kê tài sản">
    </iframe>

  </div>
</body>
</html>
