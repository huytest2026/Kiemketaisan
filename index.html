
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>KIỂM KÊ TÀI SẢN</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
    }

    .app {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
    }

    .header {
      height: 42px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 12px;
      color: white;
      background: #174a7e;
      font-size: 14px;
      font-weight: bold;
    }

    .header a {
      color: white;
      text-decoration: none;
      font-size: 12px;
      font-weight: normal;
    }

    .frame-wrap {
      flex: 1;
      min-height: 0;
      position: relative;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: white;
    }

    .loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f1f5f9;
      color: #174a7e;
      z-index: 1;
      pointer-events: none;
    }

    @media (max-width: 600px) {
      .header {
        height: 36px;
      }
    }
  </style>
</head>

<body>
  <div class="app">

    <div class="header">
      <span>KIỂM KÊ TÀI SẢN</span>

      <a
        href="https://script.google.com/macros/s/AKfycbxCMKhXleevsS-nGpDTVLXidklfRGUrny6PG7EfrnZ4aTYsB1EsiqQmBBT6UROhXRcE6w/exec"
        target="_blank"
        rel="noopener">
        Mở cửa sổ riêng
      </a>
    </div>

    <div class="frame-wrap">

      <div class="loading" id="loading">
        Đang mở ứng dụng kiểm kê...
      </div>

      <iframe
        id="inventoryApp"
        src="https://script.google.com/macros/s/AKfycbxCMKhXleevsS-nGpDTVLXidklfRGUrny6PG7EfrnZ4aTYsB1EsiqQmBBT6UROhXRcE6w/exec"
        allow="fullscreen"
        allowfullscreen>
      </iframe>

    </div>
  </div>

  <script>
    document.getElementById('inventoryApp')
      .addEventListener('load', function() {
        document.getElementById('loading').style.display = 'none';
      });
  </script>
</body>
</html>
